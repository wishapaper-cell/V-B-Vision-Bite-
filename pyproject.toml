[tool.pytest.ini_options]
testpaths = [
  "apps/user-web/tests",
  "services/recognition/tests",
  "tools/camera-link/tests",
]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".workspace",
  "artifacts",
  "legacy",
  "**/.venv",
  "**/build",
  "**/__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
