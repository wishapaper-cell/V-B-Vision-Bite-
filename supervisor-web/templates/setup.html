{% extends 'base.html' %}
{% block title %}初始化{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-logo">食</div>
    <h1>初始化管理端</h1>
    <p>创建第一个超级管理员，此步骤只会出现一次。</p>
    <form method="post">
        <label>管理员账号<input name="username" required minlength="4" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="例如：admin"></label>
        <label>显示名称<input name="display_name" required maxlength="30" placeholder="例如：系统管理员"></label>
        <label>管理员密码<input type="password" name="password" required minlength="10" autocomplete="new-password" placeholder="至少 10 位，包含大小写字母和数字"></label>
        <button class="btn primary full">创建超级管理员</button>
    </form>
</div>
{% endblock %}
